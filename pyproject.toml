[project]
name = "nconotes"
version = "0.1.0"
description = "No Cognitive Overflow Notes - a minimalistic and unstructured note-taking application"
authors = [
    {name = "lock3r"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pyside6 (>=6.10.1,<7.0.0)",
    "fastapi[standard] (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "pywebview (>=6.2.1,<7.0.0)"
]

[tool.poetry]
packages = [
    {include = "backend", from = "src"},
    {include = "main.py", from = "src"},
]

[tool.poetry.scripts]
nconotes = "main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
